
name: Terraform CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: environment/dev

env:
  TF_VERSION: "1.14.0"
  TF_IN_AUTOMATION: "true"

concurrency:
  group: terraform-production
  cancel-in-progress: false

jobs:

  # ============================================================
  # TERRAFORM PLAN
  # ============================================================

  terraform_plan:

    name: Terraform Production Plan

    runs-on: ubuntu-latest

    environment:
      name: Production

    steps:

      # -------------------------
      # Checkout
      # -------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4

      # -------------------------
      # Terraform
      # -------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Version
        run: terraform version

      # -------------------------
      # Azure Login
      # -------------------------

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.login }}

      # -------------------------
      # Terraform Init
      # -------------------------

      - name: Terraform Init
        run: |
          terraform init \
            -input=false \
            -lock-timeout=5m

      # -------------------------
      # Terraform Validate
      # -------------------------

      - name: Terraform Validate
        run: terraform validate -no-color

      # -------------------------
      # Terraform Plan
      # -------------------------

      - name: Terraform Plan
        run: |
          terraform plan \
            -input=false \
            -lock-timeout=5m \
            -out=tfplan

      # -------------------------
      # Show Plan
      # -------------------------

      - name: Terraform Show Plan
        run: |
          terraform show -no-color tfplan > tfplan.txt

          echo "======================================"
          echo "Terraform Plan"
          echo "======================================"

          cat tfplan.txt

      # -------------------------
      # Upload Plan Artifact
      # -------------------------

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: production-tfplan
          path: environment/dev/tfplan
          retention-days: 1


  # ============================================================
  # TERRAFORM APPLY
  # ============================================================

  terraform_apply:

    name: Terraform Production Apply

    runs-on: ubuntu-latest

    needs: terraform_plan

    environment:
      name: Production

    steps:

      # -------------------------
      # Checkout
      # -------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4

      # -------------------------
      # Terraform
      # -------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # -------------------------
      # Azure Login
      # -------------------------

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.login }}

      # -------------------------
      # Terraform Init
      # -------------------------

      - name: Terraform Init
        run: |
          terraform init \
            -input=false \
            -lock-timeout=5m

      # -------------------------
      # Download Approved Plan
      # -------------------------

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: production-tfplan
          path: environment/dev

      # -------------------------
      # Terraform Apply
      # -------------------------

      - name: Terraform Apply
        run: |
          terraform apply \
            -input=false \
            -lock-timeout=5m \
            -auto-approve \
            tfplan
            

      # -------------------------
      # Terraform Output
      # -------------------------

      - name: Terraform Output
        run: terraform output

      # -------------------------
      # Terraform State List
      # -------------------------

      - name: Terraform State List
        run: terraform state list

      # -------------------------
      # Deployment Summary
      # -------------------------

      - name: Deployment Summary
        run: |
          echo "## 🚀 Terraform Production Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | Production |" >> $GITHUB_STEP_SUMMARY
          echo "| Terraform | $TF_VERSION |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | Azure Storage |" >> $GITHUB_STEP_SUMMARY
          echo "| Deployment | SUCCESS |" >> $GITHUB_STEP_SUMMARY

